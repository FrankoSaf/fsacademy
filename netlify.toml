# These two were previously written as double-encoded UTF-8 ("Ã¼ber-uns" -
# bytes C3 83 C2 BC where "ü" is C3 BC), so they could never match a real
# request. Percent-encoding is unambiguous and survives any editor.
[[redirects]]
  from = "/%C3%BCber-uns-d%C3%BCsseldorf"
  to = "/duesseldorf/"
  status = 301
[[redirects]]
  from = "/über-uns-düsseldorf"
  to = "/duesseldorf/"
  status = 301
[[redirects]]
  from = "/%C3%BCber-uns-neuss"
  to = "/neuss/"
  status = 301
[[redirects]]
  from = "/über-uns-neuss"
  to = "/neuss/"
  status = 301

