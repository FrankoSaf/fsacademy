[build]
  command = "npm run build"
  publish = "dist"

[images]
  remote_images = ["https://images\\.unsplash\\.com/.*", "https://irp\\.cdn-website\\.com/.*", "https://s3\\.ca-central-1\\.amazonaws\\.com/.*"]

# 301 redirects: consolidate www to apex (finesoundacademy.com)
[[redirects]]
  from = "https://www.finesoundacademy.com/*"
  to = "https://finesoundacademy.com/:splat"
  status = 301
  force = true

[[redirects]]
  from = "http://www.finesoundacademy.com/*"
  to = "https://finesoundacademy.com/:splat"
  status = 301
  force = true

[[redirects]]
  from = "http://finesoundacademy.com/*"
  to = "https://finesoundacademy.com/:splat"
  status = 301
  force = true

