# ---------------------------------------------------------------------------
# Removed legacy URLs with no replacement (410 Gone tells crawlers to drop
# them, unlike a 404 which they keep retrying).
# ---------------------------------------------------------------------------
[[redirects]]
  from = "/danke"
  to = "/404.html"
  status = 410
  force = true
[[redirects]]
  from = "/danke/"
  to = "/404.html"
  status = 410
  force = true
[[redirects]]
  from = "/feed/rss2"
  to = "/404.html"
  status = 410
  force = true
[[redirects]]
  from = "/feed/rss2/"
  to = "/404.html"
  status = 410
  force = true

# ---------------------------------------------------------------------------
# Caching. Astro fingerprints everything under /_astro/, so those are safe to
# pin forever. /uploads/ and /brand/ are not fingerprinted - they keep a long
# max-age but stay revalidatable so replacing a photo in the CMS can take
# effect without a filename change.
# ---------------------------------------------------------------------------
[[headers]]
  for = "/_astro/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/uploads/*"
  [headers.values]
    Cache-Control = "public, max-age=2592000, stale-while-revalidate=86400"

[[headers]]
  for = "/brand/*"
  [headers.values]
    Cache-Control = "public, max-age=2592000, stale-while-revalidate=86400"

[[headers]]
  for = "/instrument-icons/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    Referrer-Policy = "strict-origin-when-cross-origin"
    # Opt out of browser features the site never uses, so a compromised
    # third-party script can't reach for them.
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), payment=(), usb=()"
    # Netlify serves this site HTTPS-only; the apex redirects above make the
    # first hop, and HSTS removes it for repeat visitors.
    #
    # Deliberately WITHOUT `includeSubDomains` and `preload`: the gesang./
    # gitarre. subdomains are in play, and preload-list removal takes months.
    # Add both only once every subdomain is confirmed HTTPS-only.
    Strict-Transport-Security = "max-age=31536000"
