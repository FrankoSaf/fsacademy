[build]
  command = "npm run build"
  publish = "dist"

[images]
  remote_images = [
    "https://images\\.unsplash\\.com/.*",
    "https://irp\\.cdn-website\\.com/.*",
    "https://s3\\.ca-central-1\\.amazonaws\\.com/.*",
  ]

# ---------------------------------------------------------------------------
# Host canonicalisation: consolidate www + http on the apex.
# ---------------------------------------------------------------------------
[[redirects]]
  from = "https://www.finesoundacademy.com/*"
  to = "https://finesoundacademy.com/:splat"
  status = 301
  force = true

[[redirects]]
  from = "http://www.finesoundacademy.com/*"
  to = "https://finesoundacademy.com/:splat"
  status = 301
  force = true

[[redirects]]
  from = "http://finesoundacademy.com/*"
  to = "https://finesoundacademy.com/:splat"
  status = 301
  force = true

# ---------------------------------------------------------------------------
# Retired pages.
#
# The generic /unterricht/<instrument>/ stubs (~200 words each) competed with
# the far richer /<city>/unterricht/<instrument>/ pages for the same queries,
# and the /<city>/unterricht/ hubs duplicated the instrument list already on
# each city page. Both tiers are gone; these keep the old URLs resolving.
#
# Every `to` carries a trailing slash: the site sets `trailingSlash: 'always'`,
# so a slashless target would 301 a second time and turn each of these into a
# two-hop chain.
# ---------------------------------------------------------------------------
[[redirects]]
  from = "/unterricht/klavier"
  to = "/unterricht/#klavier"
  status = 301
[[redirects]]
  from = "/unterricht/gitarre"
  to = "/unterricht/#gitarre"
  status = 301
[[redirects]]
  from = "/unterricht/bass"
  to = "/unterricht/#bass"
  status = 301
[[redirects]]
  from = "/unterricht/gesang"
  to = "/unterricht/#gesang"
  status = 301
[[redirects]]
  from = "/unterricht/schlagzeug"
  to = "/unterricht/#schlagzeug"
  status = 301

[[redirects]]
  from = "/duesseldorf/unterricht"
  to = "/duesseldorf/"
  status = 301
[[redirects]]
  from = "/neuss/unterricht"
  to = "/neuss/"
  status = 301

