backend:
  name: git-gateway
  branch: main

media_folder: 'public/images/uploads'
public_folder: '/images/uploads'

collections:
  - name: 'content'
    label: 'Page Content'
    files:
      - label: 'Landing Page'
        name: 'landing'
        file: 'src/data/landing.json'
        fields:
          - label: 'Hero Section'
            name: 'hero'
            widget: 'object'
            fields:
              - { label: 'Title', name: 'title', widget: 'string' }
              - { label: 'Subtitle', name: 'subtitle', widget: 'text' }
              - {
                  label: 'Background Image',
                  name: 'bgImage',
                  widget: 'image',
                  required: false,
                }
              - { label: 'CTA Text', name: 'ctaText', widget: 'string' }
              - { label: 'CTA Link', name: 'ctaLink', widget: 'string' }

          - label: 'Features'
            name: 'features'
            widget: 'list'
            fields:
              - { label: 'Title', name: 'title', widget: 'string' }
              - { label: 'Description', name: 'description', widget: 'text' }
              - {
                  label: 'Icon',
                  name: 'icon',
                  widget: 'image',
                  required: false,
                }

          - label: 'About Section'
            name: 'about'
            widget: 'object'
            fields:
              - { label: 'Title', name: 'title', widget: 'string' }
              - { label: 'Content', name: 'content', widget: 'markdown' }
              - {
                  label: 'Image',
                  name: 'image',
                  widget: 'image',
                  required: false,
                }

          - label: 'Contact Section'
            name: 'contact'
            widget: 'object'
            fields:
              - { label: 'Title', name: 'title', widget: 'string' }
              - { label: 'Email', name: 'email', widget: 'string' }
              - { label: 'Phone', name: 'phone', widget: 'string' }
