# Fine Sound Academy – Netlify CMS
# Content is stored in content/ and used at build time.
# Structure: one collection per "page" or section so you can fill every part of the site from the CMS.

backend:
  name: git-gateway
  branch: master

local_backend: true

locale: de

media_folder: "public/uploads"
public_folder: "/uploads"

site_url: "https://finesoundacademy.com"
display_url: "https://finesoundacademy.com"

collections:
  # ─── Global ─────────────────────────────────────────────────────────────
  - name: site
    label: "🌐 Site & SEO"
    editor: { preview: false }
    files:
      - label: Globale Einstellungen
        name: globals
        file: "content/globals.json"
        format: json
        fields:
          - { label: "Seitentitel (Standard)", name: siteTitle, widget: string, default: "Fine Sound Academy – Musikschule Düsseldorf & Neuss" }
          - { label: "Meta-Beschreibung (Standard)", name: defaultMetaDescription, widget: text, default: "Musikschule in Düsseldorf und Neuss: Professioneller Unterricht für Klavier, Gitarre, Gesang, Bass und Schlagzeug. Kostenlose Probestunde." }
          - { label: "OG-Bild (Social Sharing)", name: ogImage, widget: image, required: false, hint: "1200×630 empfohlen. Logo oder Custom Share Image." }
          - { label: "OG-Bild Alt-Text", name: ogImageAlt, widget: string, required: false, default: "Fine Sound Academy – Musikschule Düsseldorf & Neuss" }
          - { label: "Twitter @handle", name: twitterHandle, widget: string, required: false }
          - { label: "WhatsApp-URL (floating Button)", name: whatsappUrl, widget: string, required: false, hint: "z.B. https://wa.me/4917677154511" }
          - { label: "Probestunde / Buchungs-URL", name: probestundeUrl, widget: string, required: false, hint: "Link zur Axinio-Buchung oder Kontaktformular." }
          - { label: "Google Ads ID (nur Zahl)", name: googleAdsId, widget: string, required: false, hint: "z.B. 123456789 aus AW-123456789" }
          - { label: "Google Ads Conversion ID (Label)", name: googleAdsConversionId, widget: string, required: false, hint: "Conversion-Aktion-Label aus Google Ads" }
          - { label: "Conversion-Wert (optional, EUR)", name: conversionValue, widget: string, required: false, hint: "z.B. 50 für Lead-Wert" }

  # ─── Startseite ──────────────────────────────────────────────────────────
  - name: landing
    label: "🏠 Startseite & Navigation"
    editor: { preview: false }
    files:
      - label: Startseite & Navigation (Hero, Nav, Instrumente, CTA, Team, Footer)
        name: landing
        file: "content/landing.json"
        format: json
        fields:
          - label: Hero
            name: hero
            widget: object
            fields:
              - { label: Titel, name: title, widget: string }
              - { label: Untertitel, name: subtitle, widget: string }
              - { label: Button-Text, name: buttonText, widget: string }
              - { label: Button-Link, name: buttonLink, widget: string }
              - { label: Hintergrundbild, name: image, widget: image }
          - label: Navigation
            name: navigation
            widget: object
            fields:
              - label: Logo
                name: logo
                widget: object
                fields:
                  - { label: "Logo Farbe (schwarze Nav)", name: primaryImage, widget: string }
                  - { label: "Logo Schwarz (weiße Nav nach Scroll)", name: secondaryImage, widget: string }
                  - { label: Alt-Text, name: alt, widget: string }
                  - { label: Link (z. B. /), name: link, widget: string }
              - label: Social Media
                name: socialMedia
                widget: list
                fields:
                  - { label: Name, name: name, widget: string }
                  - { label: URL, name: url, widget: string }
                  - { label: Icon, name: icon, widget: select, options: [facebook, instagram, linkedin, whatsapp, tiktok] }
              - label: Menü-Links
                name: links
                widget: list
                fields:
                  - { label: Text, name: text, widget: string }
                  - { label: URL, name: url, widget: string }
              - label: CTA-Button
                name: cta
                widget: object
                fields:
                  - { label: Text, name: text, widget: string }
                  - { label: URL, name: url, widget: string }
          - label: Intro-Bereich (HomeIntro)
            name: homeIntro
            widget: object
            hint: "Textblock zwischen Hero und Instrumente."
            fields:
              - { label: Überschrift, name: heading, widget: string }
              - { label: Lead-Zeile (unter der Überschrift), name: lead, widget: string }
              - label: Absätze
                name: paragraphs
                widget: list
                field: { label: Absatz, name: paragraph, widget: text }
              - label: Info-Karten
                name: cards
                widget: list
                summary: "{{fields.title}}"
                fields:
                  - { label: Titel, name: title, widget: string }
                  - { label: Text, name: text, widget: string }
              - { label: CTA-Text (z.B. Buche jetzt deine kostenlose Probestunde…), name: ctaText, widget: string }
          - label: Standorte-Block (Unsere Standorte)
            name: locationsBlock
            widget: object
            hint: "Bereich „Unsere Standorte“ auf der Startseite."
            fields:
              - { label: Überschrift, name: heading, widget: string }
              - { label: Intro-Text, name: intro, widget: string }
          - label: Instrumente (Übersicht Startseite)
            name: instruments
            widget: object
            fields:
              - { label: Titel, name: title, widget: string }
              - { label: Untertitel, name: subtitle, widget: string }
              - label: Einträge
                name: items
                widget: list
                fields:
                  - { label: Name, name: name, widget: string }
                  - { label: Icon, name: icon, widget: select, options: [bass, guitar, piano, vocals, drums] }
                  - { label: Beschreibung, name: description, widget: text }
          - label: FAQ (Startseite)
            name: faq
            widget: object
            hint: "Häufige Fragen auf der Startseite."
            fields:
              - { label: Überschrift, name: heading, widget: string }
              - label: Fragen & Antworten
                name: items
                widget: list
                summary: "{{fields.question}}"
                fields:
                  - { label: Frage, name: question, widget: string }
                  - { label: Antwort, name: answer, widget: text }
          - label: Trust-Block (Vertrauenszeile)
            name: trustBlock
            widget: object
            fields:
              - { label: Text (z.B. "Kostenlose Probestunde"), name: text, widget: string }
              - { label: Untertitel (z.B. "Über 500 Schüler"), name: subtext, widget: string }
          - label: Testimonials (Kundenstimmen)
            name: testimonials
            widget: object
            fields:
              - { label: Überschrift, name: title, widget: string }
              - label: Einträge
                name: items
                widget: list
                summary: "{{fields.name}}"
                fields:
                  - { label: Name, name: name, widget: string }
                  - { label: Zitat, name: text, widget: text }
                  - { label: Instrument, name: instrument, widget: string }
          - label: CTA-Bereich (Startseite)
            name: cta
            widget: object
            fields:
              - { label: Titel, name: title, widget: string }
              - { label: Untertitel, name: subtitle, widget: string }
              - { label: Button-Text, name: buttonText, widget: string }
              - { label: Button-Link, name: buttonLink, widget: string }
          - label: Team (Startseite)
            name: team
            widget: object
            fields:
              - { label: Titel, name: title, widget: string }
              - { label: Intro-Text, name: intro, widget: text }
              - label: Mitglieder
                name: members
                widget: list
                summary: "{{fields.name}}"
                fields:
                  - { label: ID, name: id, widget: string }
                  - { label: Name, name: name, widget: string }
                  - { label: Rolle, name: role, widget: string }
                  - { label: Bild, name: image, widget: image }
                  - { label: Alt-Text, name: alt, widget: string }
                  - { label: Standorte, name: locations, widget: list, summary: "{{fields.location}}", field: { label: Standort, name: location, widget: string } }
          - label: Footer
            name: footer
            widget: object
            fields:
              - label: Logo
                name: logo
                widget: object
                fields:
                  - { label: Bild, name: image, widget: image }
                  - { label: Alt, name: alt, widget: string }
                  - { label: Link, name: link, widget: string }
              - label: Navigation
                name: navigation
                widget: list
                fields:
                  - { label: Text, name: text, widget: string }
                  - { label: URL, name: url, widget: string }
              - label: Rechtliches
                name: legal
                widget: list
                fields:
                  - { label: Text, name: text, widget: string }
                  - { label: URL, name: url, widget: string }
                  - { label: Hervorheben, name: highlight, widget: boolean, default: false }
              - label: CTA
                name: cta
                widget: object
                fields:
                  - { label: Text, name: text, widget: string }
                  - { label: URL, name: url, widget: string }

  # ─── Über uns ────────────────────────────────────────────────────────────
  - name: about
    label: "📖 Über uns (Seite)"
    editor: { preview: false }
    files:
      - label: Über-uns-Seite (Hero, Abschnitte, CTA)
        name: about
        file: "content/about.json"
        format: json
        fields:
          - label: Hero
            name: hero
            widget: object
            fields:
              - { label: Titel, name: title, widget: string }
              - { label: Untertitel, name: subtitle, widget: string }
          - label: Inhalts-Blöcke
            name: content
            widget: object
            fields:
              - label: Abschnitte
                name: sections
                widget: list
                summary: "{{fields.title}}"
                fields:
                  - { label: Überschrift, name: title, widget: string }
                  - label: Absätze
                    name: paragraphs
                    widget: list
                    field: { label: Absatz, name: paragraph, widget: text }
          - label: CTA
            name: cta
            widget: object
            fields:
              - { label: Titel, name: title, widget: string }
              - { label: Beschreibung, name: description, widget: text }
              - { label: Button-Text, name: buttonText, widget: string }
              - { label: Button-Link, name: buttonLink, widget: string }

  # ─── Preise (eigene Seite) ──────────────────────────────────────────────
  - name: pricing
    label: "💰 Preise (Seite)"
    editor: { preview: false }
    files:
      - label: Preise-Seite (Hero, Tarife, Zusatz-Infos, FAQ, CTA)
        name: pricing
        file: "content/pricing.json"
        format: json
        fields:
          - label: Hero
            name: hero
            widget: object
            fields:
              - { label: Titel, name: title, widget: string }
              - { label: Untertitel, name: subtitle, widget: string }
          - label: Tarife
            name: plans
            widget: list
            summary: "{{fields.name}}"
            fields:
              - { label: Name, name: name, widget: string }
              - { label: Preis, name: price, widget: string }
              - { label: Zeitraum, name: period, widget: string }
              - { label: Kurzbeschreibung, name: description, widget: string }
              - label: Features
                name: features
                widget: list
                field: { label: Feature, name: feature, widget: string }
              - { label: Button-Text, name: buttonText, widget: string }
              - { label: Button-Link, name: buttonLink, widget: string }
              - { label: Beliebt, name: popular, widget: boolean, default: false }
          - label: Zusatz-Infos
            name: additionalInfo
            widget: list
            summary: "{{fields.title}}"
            fields:
              - { label: Titel, name: title, widget: string }
              - { label: Beschreibung, name: description, widget: text }
          - label: FAQ
            name: faq
            widget: list
            summary: "{{fields.question}}"
            fields:
              - { label: Frage, name: question, widget: string }
              - { label: Antwort, name: answer, widget: text }
          - label: CTA
            name: cta
            widget: object
            fields:
              - { label: Titel, name: title, widget: string }
              - { label: Beschreibung, name: description, widget: string }
              - { label: Button-Text, name: buttonText, widget: string }
              - { label: Button-Link, name: buttonLink, widget: string }

  # ─── Instrumente (Detailseiten /unterricht/[instrument]) ───────────────────
  - name: instruments
    label: "🎹 Instrumente (Detailseiten)"
    editor: { preview: true }
    files:
      - label: Instrumente (Klavier, Gitarre, Bass, Gesang, Schlagzeug)
        name: instruments
        file: "content/instruments.json"
        format: json
        hint: "Inhalte für /unterricht/klavier, /unterricht/gitarre usw."
        fields:
          - label: Klavier
            name: klavier
            widget: object
            fields:
              - { label: Titel, name: title, widget: string }
              - { label: Untertitel, name: subtitle, widget: string }
              - label: Abschnitte
                name: sections
                widget: list
                summary: "{{fields.heading}}"
                fields:
                  - { label: Überschrift, name: heading, widget: string }
                  - { label: Inhalt, name: content, widget: text }
          - label: Gitarre
            name: gitarre
            widget: object
            fields:
              - { label: Titel, name: title, widget: string }
              - { label: Untertitel, name: subtitle, widget: string }
              - label: Abschnitte
                name: sections
                widget: list
                summary: "{{fields.heading}}"
                fields:
                  - { label: Überschrift, name: heading, widget: string }
                  - { label: Inhalt, name: content, widget: text }
          - label: Bass
            name: bass
            widget: object
            fields:
              - { label: Titel, name: title, widget: string }
              - { label: Untertitel, name: subtitle, widget: string }
              - label: Abschnitte
                name: sections
                widget: list
                summary: "{{fields.heading}}"
                fields:
                  - { label: Überschrift, name: heading, widget: string }
                  - { label: Inhalt, name: content, widget: text }
          - label: Gesang
            name: gesang
            widget: object
            fields:
              - { label: Titel, name: title, widget: string }
              - { label: Untertitel, name: subtitle, widget: string }
              - label: Abschnitte
                name: sections
                widget: list
                summary: "{{fields.heading}}"
                fields:
                  - { label: Überschrift, name: heading, widget: string }
                  - { label: Inhalt, name: content, widget: text }
          - label: Schlagzeug
            name: schlagzeug
            widget: object
            fields:
              - { label: Titel, name: title, widget: string }
              - { label: Untertitel, name: subtitle, widget: string }
              - label: Abschnitte
                name: sections
                widget: list
                summary: "{{fields.heading}}"
                fields:
                  - { label: Überschrift, name: heading, widget: string }
                  - { label: Inhalt, name: content, widget: text }

  # ─── Unterricht (Übersicht + Instrumente) ───────────────────────────────
  - name: unterricht
    label: "🎵 Unterricht (Seite)"
    editor: { preview: false }
    files:
      - label: Unterricht-Übersicht (Hero, Intro, Instrumente-Liste)
        name: unterricht
        file: "content/unterricht.json"
        format: json
        fields:
          - label: Hero
            name: hero
            widget: object
            fields:
              - { label: Titel, name: title, widget: string }
              - { label: Untertitel, name: subtitle, widget: string }
          - label: Intro
            name: intro
            widget: object
            fields:
              - { label: Text, name: text, widget: text }
          - label: Instrumente
            name: instruments
            widget: list
            summary: "{{fields.name}}"
            fields:
              - { label: ID, name: id, widget: string }
              - { label: Name, name: name, widget: string }
              - { label: Slug, name: slug, widget: string }
              - { label: Bild, name: image, widget: image }
              - { label: Beschreibung, name: description, widget: text }
              - label: Highlights
                name: highlights
                widget: list
                field: { label: Punkt, name: highlight, widget: string }

  # ─── Standorte (vollständige Seiteninhalte) ───────────────────────────────
  - name: locations
    label: "📍 Standorte (Seiten)"
    editor: { preview: false }
    files:
      - label: Standort Düsseldorf (komplette Seite)
        name: duesseldorf
        file: "content/duesseldorf.json"
        format: json
        fields:
          - { label: Name, name: name, widget: string }
          - { label: Adresse, name: address, widget: string }
          - { label: "Untertitel (z. B. Stadtteil)", name: subtitle, widget: string }
          - label: "Startseite-Karte (Bild & Button)"
            name: card
            widget: object
            required: false
            hint: "Erscheint auf der Startseite im Bereich „Unsere Standorte“."
            fields:
              - { label: Bild, name: image, widget: image }
              - { label: Button-Text, name: buttonText, widget: string, default: "Zur Schule Düsseldorf" }
          - label: CTA-Bereich (Standort Düsseldorf)
            name: cta
            widget: object
            hint: "Eigener CTA-Text für die Düsseldorf-Seite (Titel, Untertitel, Button)."
            fields:
              - { label: Titel, name: title, widget: string }
              - { label: Untertitel, name: subtitle, widget: string }
              - { label: Button-Text, name: buttonText, widget: string }
              - { label: Button-Link, name: buttonLink, widget: string }
          - label: Info-Karten (Zahlungsart, Parkmöglichkeiten, Rabatte)
            name: infoCards
            widget: list
            hint: "Erscheint auf der Düsseldorf-Seite. Zahlungsart, Parkmöglichkeiten, Rabatte – jeweils bearbeitbar."
            summary: "{{fields.title}}"
            fields:
              - { label: Titel, name: title, widget: string }
              - { label: Beschreibung, name: description, widget: text }
          - label: Hero
            name: hero
            widget: object
            fields:
              - { label: Titel, name: title, widget: string }
              - { label: Untertitel (z. B. Adresse/Stadtteil), name: subtitle, widget: string }
              - { label: Kurztext, name: text, widget: text }
          - label: Intro (Über den Standort)
            name: intro
            widget: object
            fields:
              - { label: Überschrift, name: heading, widget: string }
              - label: Absätze
                name: paragraphs
                widget: list
                field: { label: Absatz, name: paragraph, widget: text }
          - label: Karte „Anfahrt & Lage“
            name: directionsCard
            widget: object
            fields:
              - { label: Titel, name: title, widget: string }
              - label: Zeilen (eine pro Zeile)
                name: lines
                widget: list
                field: { label: Zeile, name: line, widget: string }
          - label: Karte „Öffnungszeiten“
            name: hoursCard
            widget: object
            fields:
              - { label: Titel, name: title, widget: string }
              - label: Zeilen
                name: lines
                widget: list
                field: { label: Zeile, name: line, widget: string }
          - label: Instrumente-Übersicht
            name: instruments
            widget: object
            fields:
              - { label: Überschrift, name: heading, widget: string }
              - { label: Intro-Text, name: intro, widget: text }
              - label: Einträge
                name: items
                widget: list
                summary: "{{fields.title}}"
                fields:
                  - { label: Titel, name: title, widget: string }
                  - { label: Beschreibung, name: description, widget: text }
          - label: FAQ
            name: faq
            widget: object
            fields:
              - { label: Überschrift, name: heading, widget: string }
              - label: Fragen & Antworten
                name: items
                widget: list
                summary: "{{fields.question}}"
                fields:
                  - { label: Frage, name: question, widget: string }
                  - { label: Antwort, name: answer, widget: text }
          - label: About-Block (mit Bild & CTA)
            name: about
            widget: object
            fields:
              - { label: Titel, name: title, widget: string }
              - label: Absätze
                name: paragraphs
                widget: list
                field: { label: Absatz, name: paragraph, widget: text }
              - { label: Button-Text, name: buttonText, widget: string }
              - { label: Button-Link, name: buttonLink, widget: string }
              - { label: Bild, name: image, widget: image }
              - { label: Bild-Alt, name: imageAlt, widget: string }
          - label: Bewertungen / Reviews
            name: reviews
            widget: object
            required: false
            hint: "Erscheint auf der Düsseldorf-Seite und den Instrument-Seiten (gefiltert pro Instrument)."
            fields:
              - { label: Überschrift, name: title, widget: string }
              - label: Einträge
                name: items
                widget: list
                summary: "{{fields.name}} ({{fields.instrument}})"
                fields:
                  - { label: Name, name: name, widget: string }
                  - { label: Text, name: text, widget: text }
                  - { label: Instrument, name: instrument, widget: select, options: [Klavier, Gitarre, Bass, Gesang, Schlagzeug] }

      - label: Standort Neuss (komplette Seite)
        name: neuss
        file: "content/neuss.json"
        format: json
        fields:
          - { label: Name, name: name, widget: string }
          - { label: Adresse, name: address, widget: string }
          - { label: "Untertitel (z. B. Stadtteil)", name: subtitle, widget: string }
          - label: "Startseite-Karte (Bild & Button)"
            name: card
            widget: object
            required: false
            hint: "Erscheint auf der Startseite im Bereich „Unsere Standorte“."
            fields:
              - { label: Bild, name: image, widget: image }
              - { label: Button-Text, name: buttonText, widget: string, default: "Zur Schule Neuss" }
          - label: CTA-Bereich (Standort Neuss)
            name: cta
            widget: object
            hint: "Eigener CTA-Text für die Neuss-Seite (Titel, Untertitel, Button)."
            fields:
              - { label: Titel, name: title, widget: string }
              - { label: Untertitel, name: subtitle, widget: string }
              - { label: Button-Text, name: buttonText, widget: string }
              - { label: Button-Link, name: buttonLink, widget: string }
          - label: Info-Karten (Zahlungsart, Parkmöglichkeiten, Rabatte)
            name: infoCards
            widget: list
            hint: "Erscheint auf der Neuss-Seite. Zahlungsart, Parkmöglichkeiten, Rabatte – jeweils bearbeitbar."
            summary: "{{fields.title}}"
            fields:
              - { label: Titel, name: title, widget: string }
              - { label: Beschreibung, name: description, widget: text }
          - label: Hero
            name: hero
            widget: object
            fields:
              - { label: Titel, name: title, widget: string }
              - { label: Untertitel (z. B. Adresse/Stadtteil), name: subtitle, widget: string }
              - { label: Kurztext, name: text, widget: text }
          - label: Intro (Über den Standort)
            name: intro
            widget: object
            fields:
              - { label: Überschrift, name: heading, widget: string }
              - label: Absätze
                name: paragraphs
                widget: list
                field: { label: Absatz, name: paragraph, widget: text }
          - label: Karte „Anfahrt & Lage“
            name: directionsCard
            widget: object
            fields:
              - { label: Titel, name: title, widget: string }
              - label: Zeilen (eine pro Zeile)
                name: lines
                widget: list
                field: { label: Zeile, name: line, widget: string }
          - label: Karte „Öffnungszeiten“
            name: hoursCard
            widget: object
            fields:
              - { label: Titel, name: title, widget: string }
              - label: Zeilen
                name: lines
                widget: list
                field: { label: Zeile, name: line, widget: string }
          - label: Instrumente-Übersicht
            name: instruments
            widget: object
            fields:
              - { label: Überschrift, name: heading, widget: string }
              - { label: Intro-Text, name: intro, widget: text }
              - label: Einträge
                name: items
                widget: list
                summary: "{{fields.title}}"
                fields:
                  - { label: Titel, name: title, widget: string }
                  - { label: Beschreibung, name: description, widget: text }
          - label: FAQ
            name: faq
            widget: object
            fields:
              - { label: Überschrift, name: heading, widget: string }
              - label: Fragen & Antworten
                name: items
                widget: list
                summary: "{{fields.question}}"
                fields:
                  - { label: Frage, name: question, widget: string }
                  - { label: Antwort, name: answer, widget: text }
          - label: About-Block (mit Bild & CTA)
            name: about
            widget: object
            fields:
              - { label: Titel, name: title, widget: string }
              - label: Absätze
                name: paragraphs
                widget: list
                field: { label: Absatz, name: paragraph, widget: text }
              - { label: Button-Text, name: buttonText, widget: string }
              - { label: Button-Link, name: buttonLink, widget: string }
              - { label: Bild, name: image, widget: image }
              - { label: Bild-Alt, name: imageAlt, widget: string }
          - label: Bewertungen / Reviews
            name: reviews
            widget: object
            required: false
            hint: "Erscheint auf der Neuss-Seite und den Instrument-Seiten (gefiltert pro Instrument)."
            fields:
              - { label: Überschrift, name: title, widget: string }
              - label: Einträge
                name: items
                widget: list
                summary: "{{fields.name}} ({{fields.instrument}})"
                fields:
                  - { label: Name, name: name, widget: string }
                  - { label: Text, name: text, widget: text }
                  - { label: Instrument, name: instrument, widget: select, options: [Klavier, Gitarre, Bass, Gesang, Schlagzeug] }

  # ─── Lehrer (wiederverwendbar) ─────────────────────────────────────────────
  - name: teachers
    label: "👩‍🏫 Lehrer"
    editor: { preview: false }
    files:
      - label: Lehrer (für Startseite, Standorte, Kampagnen)
        name: teachers
        file: "content/teachers.json"
        format: json
        fields:
          - label: Lehrer
            name: teachers
            widget: list
            summary: "{{fields.name}} ({{fields.role}})"
            fields:
              - { label: ID, name: id, widget: string }
              - { label: Name, name: name, widget: string }
