# Fine Sound Academy – Netlify CMS
# Content is stored in content/ and used at build time.
# Structure: one collection per "page" or section so you can fill every part of the site from the CMS.

backend:
  name: git-gateway
  branch: master

local_backend: true

locale: de

media_folder: "public/uploads"
public_folder: "/uploads"

site_url: "https://www.finesoundacademy.com"
display_url: "https://www.finesoundacademy.com"

collections:
  # ─── Global ─────────────────────────────────────────────────────────────
  - name: site
    label: "🌐 Site & SEO"
    editor: { preview: false }
    files:
      - label: Globale Einstellungen
        name: globals
        file: "content/globals.json"
        format: json
        fields:
          - { label: "Seitentitel (Standard)", name: siteTitle, widget: string, default: "Fine Sound Academy – Musikschule Düsseldorf & Neuss" }
          - { label: "Meta-Beschreibung (Standard)", name: defaultMetaDescription, widget: text, default: "Musikschule in Düsseldorf und Neuss: Professioneller Unterricht für Klavier, Gitarre, Gesang, Bass und Schlagzeug. Kostenlose Probestunde." }
          - { label: "OG-Bild (Social Sharing)", name: ogImage, widget: image, required: false }
          - { label: "Twitter @handle", name: twitterHandle, widget: string, required: false }

  # ─── Startseite ──────────────────────────────────────────────────────────
  - name: landing
    label: "🏠 Startseite & Navigation"
    editor: { preview: false }
    files:
      - label: Startseite & Navigation (Hero, Nav, Standorte, Instrumente, CTA, Team, Footer)
        name: landing
        file: "content/landing.json"
        format: json
        fields:
          - label: Hero
            name: hero
            widget: object
            fields:
              - { label: Titel, name: title, widget: string }
              - { label: Untertitel, name: subtitle, widget: string }
              - { label: Button-Text, name: buttonText, widget: string }
              - { label: Button-Link, name: buttonLink, widget: string }
              - { label: Hintergrundbild, name: image, widget: image }
          - label: Navigation
            name: navigation
            widget: object
            fields:
              - label: Logo
                name: logo
                widget: object
                fields:
                  - { label: "Logo Farbe (schwarze Nav)", name: primaryImage, widget: string }
                  - { label: "Logo Schwarz (weiße Nav nach Scroll)", name: secondaryImage, widget: string }
                  - { label: Alt-Text, name: alt, widget: string }
                  - { label: Link (z. B. /), name: link, widget: string }
              - label: Social Media
                name: socialMedia
                widget: list
                fields:
                  - { label: Name, name: name, widget: string }
                  - { label: URL, name: url, widget: string }
                  - { label: Icon, name: icon, widget: select, options: [facebook, instagram, linkedin] }
              - label: Menü-Links
                name: links
                widget: list
                fields:
                  - { label: Text, name: text, widget: string }
                  - { label: URL, name: url, widget: string }
              - label: CTA-Button
                name: cta
                widget: object
                fields:
                  - { label: Text, name: text, widget: string }
                  - { label: URL, name: url, widget: string }
          - label: Standorte (Karten auf Startseite)
            name: locations
            widget: object
            fields:
              - label: Düsseldorf
                name: dusseldorf
                widget: object
                fields:
                  - { label: Name, name: name, widget: string }
                  - { label: Bild, name: image, widget: image }
                  - { label: Button-Text, name: buttonText, widget: string }
                  - { label: Link, name: link, widget: string }
              - label: Neuss
                name: neuss
                widget: object
                fields:
                  - { label: Name, name: name, widget: string }
                  - { label: Bild, name: image, widget: image }
                  - { label: Button-Text, name: buttonText, widget: string }
                  - { label: Link, name: link, widget: string }
          - label: Instrumente (Übersicht Startseite)
            name: instruments
            widget: object
            fields:
              - { label: Titel, name: title, widget: string }
              - { label: Untertitel, name: subtitle, widget: string }
              - label: Einträge
                name: items
                widget: list
                fields:
                  - { label: Name, name: name, widget: string }
                  - { label: Icon, name: icon, widget: select, options: [bass, guitar, piano, vocals, drums] }
                  - { label: Beschreibung, name: description, widget: text }
          - label: CTA-Bereich (Startseite)
            name: cta
            widget: object
            fields:
              - { label: Titel, name: title, widget: string }
              - { label: Untertitel, name: subtitle, widget: string }
              - { label: Button-Text, name: buttonText, widget: string }
              - { label: Button-Link, name: buttonLink, widget: string }
          - label: Team (Startseite)
            name: team
            widget: object
            fields:
              - { label: Titel, name: title, widget: string }
              - { label: Intro-Text, name: intro, widget: text }
              - label: Mitglieder
                name: members
                widget: list
                summary: "{{fields.name}}"
                fields:
                  - { label: ID, name: id, widget: string }
                  - { label: Name, name: name, widget: string }
                  - { label: Rolle, name: role, widget: string }
                  - { label: Bild, name: image, widget: image }
                  - { label: Alt-Text, name: alt, widget: string }
                  - { label: Standorte, name: locations, widget: list, summary: "{{fields.location}}", field: { label: Standort, name: location, widget: string } }
          - label: Footer
            name: footer
            widget: object
            fields:
              - label: Logo
                name: logo
                widget: object
                fields:
                  - { label: Bild, name: image, widget: image }
                  - { label: Alt, name: alt, widget: string }
                  - { label: Link, name: link, widget: string }
              - label: Navigation
                name: navigation
                widget: list
                fields:
                  - { label: Text, name: text, widget: string }
                  - { label: URL, name: url, widget: string }
              - label: Rechtliches
                name: legal
                widget: list
                fields:
                  - { label: Text, name: text, widget: string }
                  - { label: URL, name: url, widget: string }
                  - { label: Hervorheben, name: highlight, widget: boolean, default: false }
              - label: CTA
                name: cta
                widget: object
                fields:
                  - { label: Text, name: text, widget: string }
                  - { label: URL, name: url, widget: string }

  # ─── Über uns ────────────────────────────────────────────────────────────
  - name: about
    label: "📖 Über uns (Seite)"
    editor: { preview: false }
    files:
      - label: Über-uns-Seite (Hero, Abschnitte, CTA)
        name: about
        file: "content/about.json"
        format: json
        fields:
          - label: Hero
            name: hero
            widget: object
            fields:
              - { label: Titel, name: title, widget: string }
              - { label: Untertitel, name: subtitle, widget: string }
          - label: Inhalts-Blöcke
            name: content
            widget: object
            fields:
              - label: Abschnitte
                name: sections
                widget: list
                summary: "{{fields.title}}"
                fields:
                  - { label: Überschrift, name: title, widget: string }
                  - label: Absätze
                    name: paragraphs
                    widget: list
                    field: { label: Absatz, name: paragraph, widget: text }
          - label: CTA
            name: cta
            widget: object
            fields:
              - { label: Titel, name: title, widget: string }
              - { label: Beschreibung, name: description, widget: text }
              - { label: Button-Text, name: buttonText, widget: string }
              - { label: Button-Link, name: buttonLink, widget: string }

  # ─── Preise (eigene Seite) ──────────────────────────────────────────────
  - name: pricing
    label: "💰 Preise (Seite)"
    editor: { preview: false }
    files:
      - label: Preise-Seite (Hero, Tarife, Zusatz-Infos, FAQ, CTA)
        name: pricing
        file: "content/pricing.json"
        format: json
        fields:
          - label: Hero
            name: hero
            widget: object
            fields:
              - { label: Titel, name: title, widget: string }
              - { label: Untertitel, name: subtitle, widget: string }
          - label: Tarife
            name: plans
            widget: list
            summary: "{{fields.name}}"
            fields:
              - { label: Name, name: name, widget: string }
              - { label: Preis, name: price, widget: string }
              - { label: Zeitraum, name: period, widget: string }
              - { label: Kurzbeschreibung, name: description, widget: string }
              - label: Features
                name: features
                widget: list
                field: { label: Feature, name: feature, widget: string }
              - { label: Button-Text, name: buttonText, widget: string }
              - { label: Button-Link, name: buttonLink, widget: string }
              - { label: Beliebt, name: popular, widget: boolean, default: false }
          - label: Zusatz-Infos
            name: additionalInfo
            widget: list
            summary: "{{fields.title}}"
            fields:
              - { label: Titel, name: title, widget: string }
              - { label: Beschreibung, name: description, widget: text }
          - label: FAQ
            name: faq
            widget: list
            summary: "{{fields.question}}"
            fields:
              - { label: Frage, name: question, widget: string }
              - { label: Antwort, name: answer, widget: text }
          - label: CTA
            name: cta
            widget: object
            fields:
              - { label: Titel, name: title, widget: string }
              - { label: Beschreibung, name: description, widget: string }
              - { label: Button-Text, name: buttonText, widget: string }
              - { label: Button-Link, name: buttonLink, widget: string }

  # ─── Unterricht (Übersicht + Instrumente) ───────────────────────────────
  - name: unterricht
    label: "🎵 Unterricht (Seite)"
    editor: { preview: false }
    files:
      - label: Unterricht-Übersicht (Hero, Intro, Instrumente-Liste)
        name: unterricht
        file: "content/unterricht.json"
        format: json
        fields:
          - label: Hero
            name: hero
            widget: object
            fields:
              - { label: Titel, name: title, widget: string }
              - { label: Untertitel, name: subtitle, widget: string }
          - label: Intro
            name: intro
            widget: object
            fields:
              - { label: Text, name: text, widget: text }
          - label: Instrumente
            name: instruments
            widget: list
            summary: "{{fields.name}}"
            fields:
              - { label: ID, name: id, widget: string }
              - { label: Name, name: name, widget: string }
              - { label: Slug, name: slug, widget: string }
              - { label: Bild, name: image, widget: image }
              - { label: Beschreibung, name: description, widget: text }
              - label: Highlights
                name: highlights
                widget: list
                field: { label: Punkt, name: highlight, widget: string }

  # ─── Standorte (vollständige Seiteninhalte) ───────────────────────────────
  - name: locations
    label: "📍 Standorte (Seiten)"
    editor: { preview: false }
    files:
      - label: Standort Düsseldorf (komplette Seite)
        name: duesseldorf
        file: "content/duesseldorf.json"
        format: json
        fields:
          - label: Hero
            name: hero
            widget: object
            fields:
              - { label: Titel, name: title, widget: string }
              - { label: Untertitel (z. B. Adresse/Stadtteil), name: subtitle, widget: string }
              - { label: Kurztext, name: text, widget: text }
          - label: Intro (Über den Standort)
            name: intro
            widget: object
            fields:
              - { label: Überschrift, name: heading, widget: string }
              - label: Absätze
                name: paragraphs
                widget: list
                field: { label: Absatz, name: paragraph, widget: text }
          - label: Karte „Anfahrt & Lage“
            name: directionsCard
            widget: object
            fields:
              - { label: Titel, name: title, widget: string }
              - label: Zeilen (eine pro Zeile)
                name: lines
                widget: list
                field: { label: Zeile, name: line, widget: string }
          - label: Karte „Öffnungszeiten“
            name: hoursCard
            widget: object
            fields:
              - { label: Titel, name: title, widget: string }
              - label: Zeilen
                name: lines
                widget: list
                field: { label: Zeile, name: line, widget: string }
          - label: Instrumente-Übersicht
            name: instruments
            widget: object
            fields:
              - { label: Überschrift, name: heading, widget: string }
              - { label: Intro-Text, name: intro, widget: text }
              - label: Einträge
                name: items
                widget: list
                summary: "{{fields.title}}"
                fields:
                  - { label: Titel, name: title, widget: string }
                  - { label: Beschreibung, name: description, widget: text }
          - label: FAQ
            name: faq
            widget: object
            fields:
              - { label: Überschrift, name: heading, widget: string }
              - label: Fragen & Antworten
                name: items
                widget: list
                summary: "{{fields.question}}"
                fields:
                  - { label: Frage, name: question, widget: string }
                  - { label: Antwort, name: answer, widget: text }
          - label: About-Block (mit Bild & CTA)
            name: about
            widget: object
            fields:
              - { label: Titel, name: title, widget: string }
              - label: Absätze
                name: paragraphs
                widget: list
                field: { label: Absatz, name: paragraph, widget: text }
              - { label: Button-Text, name: buttonText, widget: string }
              - { label: Button-Link, name: buttonLink, widget: string }
              - { label: Bild, name: image, widget: image }
              - { label: Bild-Alt, name: imageAlt, widget: string }

      - label: Standort Neuss (komplette Seite)
        name: neuss
        file: "content/neuss.json"
        format: json
        fields:
          - label: Hero
            name: hero
            widget: object
            fields:
              - { label: Titel, name: title, widget: string }
              - { label: Untertitel (z. B. Adresse/Stadtteil), name: subtitle, widget: string }
              - { label: Kurztext, name: text, widget: text }
          - label: Intro (Über den Standort)
            name: intro
            widget: object
            fields:
              - { label: Überschrift, name: heading, widget: string }
              - label: Absätze
                name: paragraphs
                widget: list
                field: { label: Absatz, name: paragraph, widget: text }
          - label: Karte „Anfahrt & Lage“
            name: directionsCard
            widget: object
            fields:
              - { label: Titel, name: title, widget: string }
              - label: Zeilen (eine pro Zeile)
                name: lines
                widget: list
                field: { label: Zeile, name: line, widget: string }
          - label: Karte „Öffnungszeiten“
            name: hoursCard
            widget: object
            fields:
              - { label: Titel, name: title, widget: string }
              - label: Zeilen
                name: lines
                widget: list
                field: { label: Zeile, name: line, widget: string }
          - label: Instrumente-Übersicht
            name: instruments
            widget: object
            fields:
              - { label: Überschrift, name: heading, widget: string }
              - { label: Intro-Text, name: intro, widget: text }
              - label: Einträge
                name: items
                widget: list
                summary: "{{fields.title}}"
                fields:
                  - { label: Titel, name: title, widget: string }
                  - { label: Beschreibung, name: description, widget: text }
          - label: FAQ
            name: faq
            widget: object
            fields:
              - { label: Überschrift, name: heading, widget: string }
              - label: Fragen & Antworten
                name: items
                widget: list
                summary: "{{fields.question}}"
                fields:
                  - { label: Frage, name: question, widget: string }
                  - { label: Antwort, name: answer, widget: text }
          - label: About-Block (mit Bild & CTA)
            name: about
            widget: object
            fields:
              - { label: Titel, name: title, widget: string }
              - label: Absätze
                name: paragraphs
                widget: list
                field: { label: Absatz, name: paragraph, widget: text }
              - { label: Button-Text, name: buttonText, widget: string }
              - { label: Button-Link, name: buttonLink, widget: string }
              - { label: Bild, name: image, widget: image }
              - { label: Bild-Alt, name: imageAlt, widget: string }

  # ─── Gemeinsame Inhalte (Komponenten auf mehreren Seiten) ─────────────────
  - name: shared
    label: "🔧 Gemeinsame Inhalte"
    editor: { preview: false }
    files:
      - label: Preise-Komponente (z. B. auf Startseite / Standort)
        name: pricing
        file: "content/shared/pricing.json"
        format: json
        fields:
          - { label: Titel, name: title, widget: string }
          - { label: Untertitel, name: subtitle, widget: string }
          - label: Tarife
            name: plans
            widget: list
            summary: "{{fields.name}}"
            fields:
              - { label: Name, name: name, widget: string }
              - { label: Preis, name: price, widget: string }
              - { label: Zeitraum, name: period, widget: string }
              - { label: Kurzbeschreibung, name: description, widget: string }
              - label: Features
                name: features
                widget: list
                field: { label: Feature, name: feature, widget: string }
              - { label: Button-Text, name: buttonText, widget: string }
              - { label: Button-Link, name: buttonLink, widget: string }
              - { label: Beliebt, name: popular, widget: boolean, default: false }
      - label: Info-Karten (Startseite / Standorte)
        name: infocards
        file: "content/shared/infocards.json"
        format: json
        fields:
          - label: Karten
            name: items
            widget: list
            summary: "{{fields.title}}"
            fields:
              - { label: Titel, name: title, widget: string }
              - { label: Beschreibung, name: description, widget: text }
