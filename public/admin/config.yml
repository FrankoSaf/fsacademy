              - { label: Alt-Text, name: alt, widget: string }
              - label: Instrumente
                name: instruments
                widget: select
                multiple: true
                options:
                  - { label: "Gesang", value: "gesang" }
                  - { label: "Klavier", value: "klavier" }
                  - { label: "Gitarre", value: "gitarre" }
                  - { label: "Bass", value: "bass" }
                  - { label: "Schlagzeug", value: "schlagzeug" }
                  - { label: "Violine", value: "violine" }
              - label: Standorte
                name: cities
